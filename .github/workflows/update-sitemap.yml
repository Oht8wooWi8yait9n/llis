name: Update NASA LLIS Lessons & Sitemap

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Harvest LLIS & Pre-render Static Pages
        run: |
          python generate_llis_sitemap.py

      - name: Commit and push updates
        run: |
          git config user.name "Aaron Sells"
          git config user.email "aaron.b.sells@nasa.gov"
          git add lessons/ index.html llis_sitemap.xml llis_urls.txt llis_direct_sitemap.xml llis_direct_urls.txt llis_lessons.jsonl
          if git diff --staged --quiet; then
            echo "No changes in NASA LLIS lessons. Skipping commit."
          else
            git commit -m "chore(sync): weekly automated NASA LLIS lessons update [skip ci]"
            for attempt in {1..5}; do
              echo "Pushing updates to origin main (attempt $attempt)..."
              if git push origin main; then
                echo "Successfully pushed updates to origin main."
                break
              fi
              echo "Push failed (attempt $attempt/5). Waiting 5 seconds before retry..."
              sleep 5
              git pull --rebase origin main || true
            done
          fi
